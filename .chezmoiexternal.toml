# External content pulled in by chezmoi at apply time.
# The passage secret store lives in its own git repo; chezmoi clones/pulls it
# into ~/.passage/store so a single `chezmoi update` populates everything.
# NOTE: ~/.passage/identities (the private key) is intentionally NOT here.
[".passage/store"]
    type = "git-repo"
    url = "https://github.com/Noghpu/passage-store.git"
    [".passage/store".pull]
        args = ["--ff-only"]

# Shared installers for upstream prebuilt binaries. Versions remain pinned in
# .chezmoidata/packages.yaml; this checkout only supplies the installer code.
[".local/share/binary-install-scripts"]
    type = "git-repo"
    url = "https://github.com/Noghpu/binary-install-scripts.git"
    [".local/share/binary-install-scripts".pull]
        args = ["--ff-only"]
