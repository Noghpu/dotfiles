# Font Configuration
font_family JetBrainsMono Nerd Font
font_size 12.0

# Keep powerline prompt glyphs to a single cell instead of letting kitty
# stretch them into following blank cells.
narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

# Window Configuration
window_padding_width 0 8
background_opacity 1.0
hide_window_decorations yes

# Derive the unset 240 palette entries from the 16 theme colors.
palette_generate semantic

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Scrollback
scrollback_lines 20000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Application-level key bindings
map ctrl+shift+t launch --cwd=current --type=tab
map ctrl+shift+i new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+[ move_tab_backward
map ctrl+shift+] move_tab_forward
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+p command_palette
map ctrl+shift+, edit_config_file

# ctrl+shift+p is the command palette now, so move kitty's default hints /
# choose-files chords off that prefix onto ctrl+shift+space.
map ctrl+shift+space>f kitten hints --type path --program -
map ctrl+shift+space>shift+f kitten hints --type path
map ctrl+shift+space>c kitten choose-files
map ctrl+shift+space>d kitten choose-files --mode=dir
map ctrl+shift+space>l kitten hints --type line --program -
map ctrl+shift+space>w kitten hints --type word --program -
map ctrl+shift+space>h kitten hints --type hash --program -
map ctrl+shift+space>n kitten hints --type linenum
map ctrl+shift+space>y kitten hints --type hyperlink

# Reserved for opening application sections.
map ctrl+shift+1 no_op
map ctrl+shift+2 no_op
map ctrl+shift+3 no_op
map ctrl+shift+4 no_op
map ctrl+shift+5 no_op
map ctrl+shift+6 no_op
map ctrl+shift+7 no_op
map ctrl+shift+8 no_op
map ctrl+shift+9 no_op

# Tab configuration
tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_bar_align left
tab_bar_min_tabs 1
tab_title_template "{custom}"

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf
include user.conf

# Keep the terminal palette consistent even when the shell regenerates Dank's
# theme include above. This comes last intentionally so Catppuccin wins.
include catppuccin-mocha.conf
