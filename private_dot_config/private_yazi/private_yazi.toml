#:schema https://yazi-rs.github.io/schemas/yazi.json

# Keep this file to intentional overrides. Unspecified values continue to
# follow the defaults shipped with the installed Yazi version.

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = true
sort_fallback  = "alphabetical"
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 8
mouse_events   = [ "click", "scroll", "drag" ]

[preview]
wrap          = "yes"
tab_size      = 2
max_width     = 1600
max_height    = 1800
image_delay   = 30
image_filter  = "triangle"
image_quality = 85

[input]
cursor_blink = true
